services:
  app:
    build: .
    image: tgparaletclubbot:latest
    env_file: .env
    command: python main.py
    restart: unless-stopped
    volumes:
      - ./cache:/app/cache

    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1

    healthcheck:
      test: ["CMD-SHELL", "avail=$(grep MemAvailable /proc/meminfo | awk '{print $$2}'); [ -n \"$$avail\" ] && [ $$avail -gt 50000 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
